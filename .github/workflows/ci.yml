name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Security (bandit, medium+)
        run: bandit -r app modules --severity-level medium

      - name: Type check (pyright, informational)
        run: pyright app modules || true
        continue-on-error: true

      - name: Tests + coverage
        run: pytest tests/

      # The extension's JS suite used to live OUTSIDE CI entirely: this workflow ran
      # Python only, so three working tests were never checked on a PR and two more had
      # been broken by a missing dependency (jsdom) with nobody noticing for weeks. The
      # extension is where the apply engine lives — its tests are the ones that pin the
      # behaviour a live run would otherwise have to discover.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS test deps
        run: npm ci

      - name: Tests (chrome extension)
        run: npm run test:ext
