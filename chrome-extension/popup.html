<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3348;
  --text:#e4e4e7;--text2:#9395a5;--accent:#6c5ce7;--accent2:#a78bfa;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);width:360px;min-height:200px}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.version{font-size:10px;color:var(--text2);font-weight:400;margin-left:4px}

.conn-row{display:flex;align-items:center;gap:6px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.conn-dot.ok{background:var(--green)}
.conn-dot.err{background:var(--red)}
.conn-text{font-size:12px;color:var(--text2)}
.profile-name{font-size:12px;color:var(--text);font-weight:600;margin-left:auto}

.body{padding:16px 18px}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 8px}
.stat .val{font-size:22px;font-weight:700;color:var(--accent2)}
.stat .lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.campaign-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px}

.campaign-stopped .start-btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;background:var(--green);color:#fff;transition:opacity .15s}
.campaign-stopped .start-btn:hover:not(:disabled){opacity:.85}
.campaign-stopped .start-btn:disabled{opacity:.4;cursor:not-allowed}
.campaign-stopped .limit-text{text-align:center;font-size:11px;color:var(--text2);margin-top:8px}

.campaign-running .run-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.campaign-running .run-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.campaign-running .run-label{font-size:14px;font-weight:700;color:var(--green)}
.campaign-running .run-time{font-size:11px;color:var(--text2);margin-left:auto}
.campaign-running .current-job{padding:8px 12px;background:var(--surface2);border-radius:8px;font-size:12px;margin-bottom:12px}
.campaign-running .current-job .cj-label{color:var(--text2);margin-bottom:2px}
.campaign-running .current-job .cj-title{font-weight:600}
.campaign-running .current-job .cj-company{color:var(--text2)}
.campaign-running .stop-btn{display:block;width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--red);color:#fff;transition:opacity .15s}
.campaign-running .stop-btn:hover{opacity:.85}

.log-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.log-header{padding:10px 14px;font-size:12px;font-weight:600;color:var(--accent2);border-bottom:1px solid var(--border)}
.log-list{max-height:140px;overflow-y:auto;padding:4px 0}
.log-item{display:flex;align-items:flex-start;gap:8px;padding:4px 14px;font-size:11px}
.log-time{color:var(--text2);font-size:10px;white-space:nowrap;min-width:42px;padding-top:1px}
.log-msg{color:var(--text);line-height:1.4}
.log-msg.ok{color:var(--green)}
.log-msg.err{color:var(--red)}
.log-empty{text-align:center;padding:16px;color:var(--text2);font-size:12px}

.dash-btn{display:block;width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:border-color .15s}
.dash-btn:hover{border-color:var(--accent)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Auth banner */
.auth-banner{display:none;flex-direction:column;align-items:center;gap:14px;padding:28px 24px;text-align:center;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(108,92,231,.12),rgba(167,139,250,.06))}
.auth-banner.visible{display:flex}
.auth-banner-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.auth-banner-title{font-size:15px;font-weight:700;color:var(--text)}
.auth-banner-sub{font-size:12px;color:var(--text2);line-height:1.5;max-width:260px}
.auth-banner-btn{padding:10px 24px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;width:100%}
.auth-banner-btn:hover{opacity:.85}
.auth-banner-note{font-size:10px;color:var(--text2)}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">JF</div>
    HireDrop<span class="version">v1.3</span>
  </div>
</div>

<div class="conn-row">
  <div class="conn-dot" id="conn-dot"></div>
  <span class="conn-text" id="conn-text">Checking...</span>
  <span class="profile-name" id="profile-name"></span>
</div>

<!-- Auth banner: shown when not logged in or token expired -->
<div class="auth-banner" id="auth-banner">
  <div class="auth-banner-icon">🔑</div>
  <div class="auth-banner-title" id="auth-banner-title">Connect Your Account</div>
  <div class="auth-banner-sub" id="auth-banner-sub">Sign in to HireDrop to start automating your job search. Your session is synced from the dashboard.</div>
  <button class="auth-banner-btn" id="btn-connect">Connect Account →</button>
  <div class="auth-banner-note">Opens HireDrop dashboard in a new tab</div>
</div>

<div class="body" id="body-main">
  <div class="stats">
    <div class="stat">
      <div class="val" id="stat-today">-</div>
      <div class="lbl">Today</div>
    </div>
    <div class="stat">
      <div class="val" id="stat-week">-</div>
      <div class="lbl">This Week</div>
    </div>
    <div class="stat">
      <div class="val" id="stat-total">-</div>
      <div class="lbl">Total</div>
    </div>
  </div>

  <!-- Stopped state -->
  <div class="campaign-section campaign-stopped" id="campaign-stopped">
    <button class="start-btn" id="btn-start">Start Campaign</button>
    <div class="limit-text" id="limit-text">0 / 50 today</div>
  </div>

  <!-- Running state (hidden by default) -->
  <div class="campaign-section campaign-running" id="campaign-running" style="display:none">
    <div class="run-header">
      <div class="run-dot"></div>
      <span class="run-label">Campaign Running</span>
      <span class="run-time" id="run-time">0:00</span>
    </div>
    <div class="current-job" id="current-job" style="display:none">
      <div class="cj-label">Current:</div>
      <div class="cj-title" id="cj-title"></div>
      <div class="cj-company" id="cj-company"></div>
    </div>
    <button class="stop-btn" id="btn-stop">Stop Campaign</button>
  </div>

  <div class="log-section">
    <div class="log-header">Activity Log</div>
    <div class="log-list" id="log-list">
      <div class="log-empty">No activity yet</div>
    </div>
  </div>

  <button class="dash-btn" id="btn-dash">Open Dashboard</button>
</div>

<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
